<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SplitSmart: scan a hostel receipt, assign items and settle up with the fewest payments. Runs entirely on your device."
    />
    <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>SplitSmart</title>
    <script>
      // Apply the saved theme before the first paint (see src/lib/theme.ts)
      try {
        const t = localStorage.getItem('splitsmart:theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelectorAll('meta[name="theme-color"]').forEach((m) => (m.content = t === 'dark' ? '#141311' : '#f3eee4'))
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
